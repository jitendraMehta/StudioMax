<main class="catalog-hub site-page">
  <studio-page-hero
    headingId="catalog-hub-heading"
    eyebrow="Our Products"
    titleBefore="Product "
    titleAccent="Catalogue"
    lead="Explore our wide range of professional audio products designed for power, performance, and reliability."
  />

  <section class="catalog-hub__grid-section" aria-label="Product categories">
    <div class="max-w-container-max mx-auto px-margin-desktop">
      <ul class="catalog-hub__grid">
        @for (category of categories; track category.id) {
          <li>
            <a class="catalog-hub__tile" [routerLink]="categoryRoute(category)">
              <span class="catalog-hub__tile-icon-wrap" aria-hidden="true">
                <span class="material-symbols-outlined catalog-hub__tile-icon">{{ category.icon }}</span>
              </span>
              <div class="catalog-hub__tile-copy">
                <h2 class="catalog-hub__tile-title">{{ category.label }}</h2>
                <p class="catalog-hub__tile-desc">{{ category.description }}</p>
                <span class="catalog-hub__tile-cta">
                  View details
                  <span class="material-symbols-outlined catalog-hub__tile-cta-icon" aria-hidden="true"
                    >arrow_forward</span
                  >
                </span>
              </div>
              <img
                class="catalog-hub__tile-image"
                [src]="category.tileImage"
                [alt]="category.label"
                loading="lazy"
              />
            </a>
          </li>
        }
      </ul>
    </div>
  </section>
</main>
