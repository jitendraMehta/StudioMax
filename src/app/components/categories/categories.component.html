<section class="core-collections py-section-gap bg-white">
  <div class="max-w-container-max mx-auto px-margin-desktop">
    <header class="core-collections__header">
      <h2 class="core-collections__title font-headline-lg text-headline-lg">Core Collections</h2>
      <p class="core-collections__lead text-on-surface-variant max-w-xl mx-auto">
        Professional inventory for demanding environments, built for precision, clarity, and studio-grade reliability.
      </p>
      <a class="core-collections__view-all inline-flex items-center gap-2 font-label-md" href="#">
        View All Categories <span class="material-symbols-outlined text-lg">arrow_forward</span>
      </a>
    </header>

    <div class="core-collections__grid">
      <ng-container *ngFor="let cat of categories; trackBy: trackById">
        <article
          class="core-collections__card group"
          [appInView]="'opacity-100 translate-y-0'"
        >
          <div class="core-collections__media">
            <img
              loading="lazy"
              class="core-collections__image"
              [alt]="cat.alt || cat.title"
              [src]="cat.image"
            />
          </div>
          <h3 class="core-collections__card-title font-headline-md text-headline-md">{{ cat.title }}</h3>
          <p class="core-collections__card-subtitle text-label-md">{{ cat.subtitle }}</p>
          <span class="core-collections__arrow material-symbols-outlined" aria-hidden="true">arrow_forward</span>
        </article>
      </ng-container>
    </div>
  </div>
</section>
