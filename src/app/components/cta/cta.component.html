<section class="studio-cta" aria-labelledby="studio-cta-heading">
  <div class="studio-cta__glow studio-cta__glow--left" aria-hidden="true"></div>
  <div class="studio-cta__glow studio-cta__glow--right" aria-hidden="true"></div>

  <div class="studio-cta__inner max-w-container-max mx-auto px-margin-desktop">
    <div class="studio-cta__copy">
      <h2 id="studio-cta-heading" class="studio-cta__title font-display-lg text-display-lg">
        <span class="studio-cta__title-line">Ready to elevate</span>
        <span class="studio-cta__title-line">
          your <span class="studio-cta__title-accent">sound?</span>
        </span>
      </h2>
      <p class="studio-cta__lead font-body-lg text-body-lg">
        Connect with our product specialists for personalized equipment recommendations and wholesale pricing.
      </p>
    </div>

    <div class="studio-cta__actions">
      <a
        class="studio-cta__btn studio-cta__btn--primary"
        [href]="whatsappUrl"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="material-symbols-outlined studio-cta__btn-icon" aria-hidden="true">chat</span>
        WhatsApp Inquiry
        <span class="material-symbols-outlined studio-cta__btn-arrow" aria-hidden="true">arrow_forward</span>
      </a>
      <button type="button" class="studio-cta__btn studio-cta__btn--secondary">
        Talk to Expert
        <span class="material-symbols-outlined studio-cta__btn-arrow" aria-hidden="true">arrow_forward</span>
      </button>
    </div>
  </div>
</section>
