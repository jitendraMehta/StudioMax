<section
  class="page-hero"
  [class.page-hero--compact]="compact()"
  [attr.aria-labelledby]="headingId()"
>
  <div class="max-w-container-max mx-auto px-margin-desktop page-hero__inner">
    <p class="page-hero__eyebrow">{{ eyebrow() }}</p>
    <h1 [id]="headingId()" class="page-hero__title">
      @if (titleBefore()) {
        {{ titleBefore() }}
      }
      @if (titleAccent()) {
        <span class="page-hero__title-accent">{{ titleAccent() }}</span>
      }
      @if (titleAfter()) {
        {{ titleAfter() }}
      }
    </h1>
    <span class="page-hero__rule" aria-hidden="true"></span>
    @if (lead()) {
      <p class="page-hero__lead">{{ lead() }}</p>
    }
  </div>
</section>
